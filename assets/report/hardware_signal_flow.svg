<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="'Fira Sans','Helvetica Neue',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a2a1a"/>
    </marker>
    <marker id="ar-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b5998"/>
    </marker>
    <marker id="ar-usb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a4a3a"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="700" fill="#faf5e9"/>
  <text x="640" y="42" font-size="22" font-weight="600" fill="#2a2418" text-anchor="middle">Hardware Signal Flow — sensors, controllers, and host</text>
  <text x="640" y="64" font-size="13" fill="#5a4a3a" text-anchor="middle" font-style="italic">physical-layer view supplementing the PCB schematic</text>

  <!-- Column headers -->
  <g font-size="12" font-weight="700" fill="#5a4a3a" text-anchor="middle" letter-spacing="0.8">
    <text x="200" y="100">SENSORS</text>
    <text x="590" y="100">MICROCONTROLLERS</text>
    <text x="990" y="100">ARM + HOST</text>
  </g>
  <g stroke="#d8ccb6" stroke-width="1" stroke-dasharray="3,4" fill="none">
    <line x1="375" y1="85" x2="375" y2="640"/>
    <line x1="805" y1="85" x2="805" y2="640"/>
  </g>

  <!-- ToF sensor stack -->
  <g filter="url(#sh)">
    <rect x="75" y="125" width="250" height="38" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="200" y="149" font-size="12" font-weight="700" fill="#b5651d" text-anchor="middle">VL53L5CX #0 — front (CH0)</text>
    <rect x="75" y="170" width="250" height="38" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="200" y="194" font-size="12" font-weight="700" fill="#b5651d" text-anchor="middle">VL53L5CX #1 — back (CH1)</text>
    <rect x="75" y="215" width="250" height="38" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="200" y="239" font-size="12" font-weight="700" fill="#b5651d" text-anchor="middle">VL53L5CX #2 — top (CH2)</text>
    <rect x="75" y="260" width="250" height="38" rx="5" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="200" y="284" font-size="12" font-weight="700" fill="#b5651d" text-anchor="middle">VL53L5CX #3 — bottom (CH3)</text>
    <text x="200" y="316" font-size="10" fill="#8a7a6a" text-anchor="middle" font-style="italic">4× 8×8 distance grid, I²C 0x29</text>
  </g>

  <!-- TCA9548A mux -->
  <g filter="url(#sh)">
    <rect x="410" y="175" width="190" height="90" rx="8" fill="#f4ecd9" stroke="#8a7a5a" stroke-width="1.8"/>
    <text x="505" y="200" font-size="13" font-weight="700" fill="#5a4a3a" text-anchor="middle">TCA9548A</text>
    <text x="505" y="218" font-size="10" fill="#5a4a3a" text-anchor="middle">8-channel I²C mux</text>
    <text x="505" y="234" font-size="10" fill="#5a4a3a" text-anchor="middle">channels 0–3 active</text>
    <text x="505" y="252" font-size="10" fill="#8a7a6a" text-anchor="middle" font-family="'JetBrains Mono',monospace">I²C 0x70</text>
  </g>

  <!-- ToF -> mux arrows -->
  <g stroke="#3b5998" stroke-width="1.5" fill="none" marker-end="url(#ar-s)">
    <path d="M 325 144 Q 380 180 410 200"/>
    <path d="M 325 189 Q 380 195 410 212"/>
    <path d="M 325 234 Q 380 230 410 228"/>
    <path d="M 325 279 Q 380 260 410 245"/>
  </g>
  <text x="375" y="165" font-size="9" fill="#3b5998" text-anchor="middle" font-style="italic">I²C SDA/SCL</text>

  <!-- IR sensors -->
  <g filter="url(#sh)">
    <rect x="75" y="355" width="250" height="90" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="200" y="378" font-size="13" font-weight="700" fill="#b5651d" text-anchor="middle">IR × 4 (active-LOW)</text>
    <text x="200" y="397" font-size="10.5" fill="#5a4a3a" text-anchor="middle">EC-Buying obstacle sensors</text>
    <text x="200" y="413" font-size="10" fill="#5a4a3a" text-anchor="middle">shared 5V / GND</text>
    <text x="200" y="430" font-size="10" fill="#8a7a6a" text-anchor="middle" font-family="'JetBrains Mono',monospace">signal → pins 2, 3, 4, 5</text>
  </g>

  <!-- IMU -->
  <g filter="url(#sh)">
    <rect x="75" y="470" width="250" height="80" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="200" y="493" font-size="13" font-weight="700" fill="#b5651d" text-anchor="middle">MPU-6050 IMU</text>
    <text x="200" y="512" font-size="10.5" fill="#5a4a3a" text-anchor="middle">accel + gyro (no magnetometer)</text>
    <text x="200" y="529" font-size="10" fill="#8a7a6a" text-anchor="middle" font-family="'JetBrains Mono',monospace">I²C 0x68 · roll/pitch only</text>
  </g>

  <!-- Teensy 4.1 -->
  <g filter="url(#sh)">
    <rect x="415" y="330" width="250" height="170" rx="10" fill="#ffffff" stroke="#3b5998" stroke-width="2"/>
    <text x="540" y="357" font-size="14" font-weight="700" fill="#3b5998" text-anchor="middle">Teensy 4.1 — sensor MCU</text>
    <line x1="435" y1="370" x2="645" y2="370" stroke="#c0c0c0" stroke-width="1"/>
    <text x="540" y="390" font-size="11" fill="#5a4a3a" text-anchor="middle">firmware: vl5_tca_4x4.ino</text>
    <text x="540" y="407" font-size="10" fill="#5a4a3a" text-anchor="middle">mux select + grid read loop</text>
    <text x="540" y="423" font-size="10" fill="#5a4a3a" text-anchor="middle">IR debounce on digital inputs</text>
    <text x="540" y="440" font-size="10" fill="#5a4a3a" text-anchor="middle">IMU fusion, emits TF/IR/IMU lines</text>
    <text x="540" y="462" font-size="10" fill="#8a7a6a" text-anchor="middle" font-family="'JetBrains Mono',monospace">USB serial → host (/dev/ttyACM1)</text>
    <text x="540" y="481" font-size="9.5" fill="#8a3a1a" text-anchor="middle" font-style="italic">bottleneck: shared serial, ~¼ native rate</text>
  </g>

  <!-- mux -> Teensy -->
  <g stroke="#3b5998" stroke-width="1.5" fill="none" marker-end="url(#ar-s)">
    <path d="M 505 265 L 505 330"/>
  </g>
  <text x="515" y="300" font-size="9" fill="#3b5998" font-style="italic">I²C</text>

  <!-- IR -> Teensy -->
  <g stroke="#3a2a1a" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <path d="M 325 400 L 415 400"/>
  </g>
  <text x="370" y="392" font-size="9" fill="#3a2a1a" text-anchor="middle" font-style="italic">digital 2–5</text>

  <!-- IMU -> Teensy -->
  <g stroke="#3b5998" stroke-width="1.5" fill="none" marker-end="url(#ar-s)">
    <path d="M 325 505 Q 370 490 415 470"/>
  </g>
  <text x="372" y="512" font-size="9" fill="#3b5998" text-anchor="middle" font-style="italic">I²C</text>

  <!-- Arduino Mega -->
  <g filter="url(#sh)">
    <rect x="415" y="555" width="250" height="90" rx="10" fill="#ffffff" stroke="#3b5998" stroke-width="2"/>
    <text x="540" y="582" font-size="14" font-weight="700" fill="#3b5998" text-anchor="middle">Arduino Mega — arm MCU</text>
    <line x1="435" y1="595" x2="645" y2="595" stroke="#c0c0c0" stroke-width="1"/>
    <text x="540" y="614" font-size="10.5" fill="#5a4a3a" text-anchor="middle">Braccio shield firmware</text>
    <text x="540" y="631" font-size="10" fill="#8a7a6a" text-anchor="middle" font-family="'JetBrains Mono',monospace">/dev/ttyACM0 · SET ALL / SET DELTA</text>
  </g>

  <!-- Host PC -->
  <g filter="url(#sh)">
    <rect x="855" y="130" width="270" height="190" rx="10" fill="#ffffff" stroke="#4a6a8a" stroke-width="2"/>
    <text x="990" y="157" font-size="14" font-weight="700" fill="#4a6a8a" text-anchor="middle">Host PC — Python controller</text>
    <line x1="875" y1="170" x2="1105" y2="170" stroke="#c0c0c0" stroke-width="1"/>
    <text x="990" y="190" font-size="11" fill="#5a4a3a" text-anchor="middle">braccio_ctrl package</text>
    <text x="990" y="208" font-size="10" fill="#5a4a3a" text-anchor="middle">serial_bridge · tof_sensor</text>
    <text x="990" y="224" font-size="10" fill="#5a4a3a" text-anchor="middle">safety/ · arm_state</text>
    <text x="990" y="242" font-size="10" fill="#5a4a3a" text-anchor="middle">session_logger · display</text>
    <text x="990" y="264" font-size="10" fill="#8a7a6a" text-anchor="middle" font-style="italic">10 Hz tick · JSONL telemetry</text>
    <text x="990" y="282" font-size="10" fill="#8a7a6a" text-anchor="middle" font-style="italic">curses TUI / FastAPI+WS</text>
    <text x="990" y="305" font-size="10" fill="#5a7a5a" text-anchor="middle" font-style="italic">digital twin: PyBullet backend</text>
  </g>

  <!-- Teensy -> Host (USB) -->
  <g stroke="#5a4a3a" stroke-width="2" fill="none" marker-end="url(#ar-usb)">
    <path d="M 665 400 Q 760 310 855 230"/>
  </g>
  <text x="740" y="348" font-size="10" fill="#5a4a3a" text-anchor="middle" font-style="italic" font-weight="600">USB serial</text>
  <text x="740" y="362" font-size="9" fill="#5a4a3a" text-anchor="middle" font-family="'JetBrains Mono',monospace">TF,IR,IMU frames</text>

  <!-- Host -> Mega (USB) -->
  <g stroke="#5a4a3a" stroke-width="2" fill="none" marker-end="url(#ar-usb)">
    <path d="M 855 260 Q 760 400 665 590"/>
  </g>
  <text x="810" y="430" font-size="10" fill="#5a4a3a" text-anchor="middle" font-style="italic" font-weight="600">USB serial</text>

  <!-- Mega -> Braccio -->
  <g filter="url(#sh)">
    <rect x="855" y="445" width="270" height="120" rx="10" fill="#ffffff" stroke="#8a3a1a" stroke-width="2"/>
    <text x="990" y="472" font-size="14" font-weight="700" fill="#8a3a1a" text-anchor="middle">Braccio V2 — 6 DOF arm</text>
    <line x1="875" y1="485" x2="1105" y2="485" stroke="#c0c0c0" stroke-width="1"/>
    <text x="990" y="503" font-size="11" fill="#5a4a3a" text-anchor="middle">base · shoulder · elbow</text>
    <text x="990" y="519" font-size="11" fill="#5a4a3a" text-anchor="middle">wrist-V · wrist-R · gripper</text>
    <text x="990" y="538" font-size="10" fill="#8a7a6a" text-anchor="middle" font-style="italic">L₁=L₂=125 mm, L₃=60 mm</text>
    <text x="990" y="555" font-size="10" fill="#8a7a6a" text-anchor="middle" font-style="italic">PWM servo control from Mega shield</text>
  </g>
  <g stroke="#8a3a1a" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M 665 605 Q 760 580 855 510"/>
  </g>
  <text x="765" y="548" font-size="10" fill="#8a3a1a" text-anchor="middle" font-weight="600">PWM</text>

  <!-- Legend -->
  <g transform="translate(75, 665)" font-size="10.5" fill="#3a2a1a">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#3b5998" stroke-width="1.5"/>
    <text x="34" y="4">I²C</text>
    <line x1="80" y1="0" x2="105" y2="0" stroke="#3a2a1a" stroke-width="1.4"/>
    <text x="114" y="4">digital GPIO</text>
    <line x1="220" y1="0" x2="245" y2="0" stroke="#5a4a3a" stroke-width="2"/>
    <text x="254" y="4">USB serial</text>
    <line x1="340" y1="0" x2="365" y2="0" stroke="#8a3a1a" stroke-width="2"/>
    <text x="374" y="4">PWM · actuation</text>
  </g>
</svg>
