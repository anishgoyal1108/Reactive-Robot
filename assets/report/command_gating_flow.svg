<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="'Fira Sans','Helvetica Neue',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a2a1a"/>
    </marker>
    <marker id="ar-rust" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a3a1a"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1.5"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#faf5e9"/>
  <text x="640" y="40" font-size="22" font-weight="600" fill="#2a2418" text-anchor="middle">Command Gating Flow — live sensor data gates every motion</text>
  <text x="640" y="62" font-size="13" fill="#5a4a3a" text-anchor="middle" font-style="italic">
    CH2 was promoted from advisory to REPLAN after the 2026-04-10 field incident
  </text>

  <!-- SENSORS column (left) -->
  <g filter="url(#sh)">
    <rect x="60" y="110" width="165" height="54" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="142" y="132" font-size="13" font-weight="700" fill="#b5651d" text-anchor="middle">ToF CH0</text>
    <text x="142" y="150" font-size="10" fill="#5a4a3a" text-anchor="middle">front · 250 mm · REPLAN</text>

    <rect x="60" y="180" width="165" height="54" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="142" y="202" font-size="13" font-weight="700" fill="#b5651d" text-anchor="middle">ToF CH1</text>
    <text x="142" y="220" font-size="10" fill="#5a4a3a" text-anchor="middle">back · 250 mm · REPLAN</text>

    <!-- CH2 highlighted as the promoted one -->
    <rect x="60" y="250" width="165" height="54" rx="6" fill="#fff3e8" stroke="#8a3a1a" stroke-width="2.2"/>
    <text x="142" y="272" font-size="13" font-weight="700" fill="#8a3a1a" text-anchor="middle">ToF CH2</text>
    <text x="142" y="290" font-size="10" fill="#5a4a3a" text-anchor="middle">top · 250 mm · REPLAN</text>

    <rect x="60" y="320" width="165" height="54" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="142" y="342" font-size="13" font-weight="700" fill="#b5651d" text-anchor="middle">ToF CH3</text>
    <text x="142" y="360" font-size="10" fill="#5a4a3a" text-anchor="middle">bottom · 250 mm · REPLAN</text>

    <rect x="60" y="405" width="165" height="54" rx="6" fill="#ffffff" stroke="#b5651d" stroke-width="1.6"/>
    <text x="142" y="427" font-size="13" font-weight="700" fill="#b5651d" text-anchor="middle">IR × 4</text>
    <text x="142" y="445" font-size="10" fill="#5a4a3a" text-anchor="middle">active-LOW · skin proximity</text>
  </g>

  <!-- CH2 promotion annotation -->
  <g>
    <text x="142" y="82" font-size="10" font-weight="700" fill="#8a3a1a" text-anchor="middle">sensor layer</text>
    <path d="M 240 277 Q 270 260 280 240" fill="none" stroke="#8a3a1a" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="240" y="210" width="138" height="36" rx="5" fill="#fff3e8" stroke="#8a3a1a" stroke-width="1.2"/>
    <text x="309" y="227" font-size="9.5" font-weight="700" fill="#8a3a1a" text-anchor="middle">promoted 2026-04-10</text>
    <text x="309" y="240" font-size="9" fill="#5a4a3a" text-anchor="middle">was 50 mm advisory-only</text>
  </g>

  <!-- Hysteresis layer (middle-left) -->
  <g filter="url(#sh)">
    <rect x="400" y="150" width="180" height="280" rx="10" fill="#f6efd9" stroke="#8a7a5a" stroke-width="1.4"/>
    <text x="490" y="180" font-size="13" font-weight="700" fill="#5a4a3a" text-anchor="middle">hysteresis.py</text>
    <text x="490" y="200" font-size="10" fill="#5a4a3a" text-anchor="middle">debounce + latch</text>
    <text x="490" y="215" font-size="10" fill="#5a4a3a" text-anchor="middle">per-channel rate limit</text>

    <line x1="420" y1="230" x2="560" y2="230" stroke="#c0ad85" stroke-width="1"/>
    <text x="490" y="252" font-size="11" font-weight="600" fill="#5a4a3a" text-anchor="middle">IR debounce</text>
    <text x="490" y="268" font-size="9" fill="#5a4a3a" text-anchor="middle" font-family="'JetBrains Mono',monospace">ON_SAMPLES · OFF_SAMPLES</text>

    <line x1="420" y1="285" x2="560" y2="285" stroke="#c0ad85" stroke-width="1"/>
    <text x="490" y="307" font-size="11" font-weight="600" fill="#5a4a3a" text-anchor="middle">obstacle latch</text>
    <text x="490" y="323" font-size="9" fill="#5a4a3a" text-anchor="middle" font-family="'JetBrains Mono',monospace">OBSTACLE_HOLD_S</text>

    <line x1="420" y1="340" x2="560" y2="340" stroke="#c0ad85" stroke-width="1"/>
    <text x="490" y="362" font-size="11" font-weight="600" fill="#5a4a3a" text-anchor="middle">transition event</text>
    <text x="490" y="378" font-size="9" fill="#5a4a3a" text-anchor="middle">clear → warn → replan</text>
    <text x="490" y="394" font-size="9" fill="#5a4a3a" text-anchor="middle">→ back_away</text>
  </g>

  <!-- Sensor → hysteresis arrows -->
  <g stroke="#3a2a1a" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <path d="M 225 137 Q 310 145 400 215"/>
    <path d="M 225 207 L 400 225"/>
    <path d="M 225 277 Q 310 275 400 250"/>
    <path d="M 225 347 Q 310 340 400 275"/>
    <path d="M 225 432 Q 310 430 400 345"/>
  </g>

  <!-- World model -->
  <g filter="url(#sh)">
    <rect x="680" y="170" width="200" height="120" rx="8" fill="#ffffff" stroke="#3b5998" stroke-width="1.7"/>
    <text x="780" y="195" font-size="13" font-weight="700" fill="#3b5998" text-anchor="middle">world_model.py</text>
    <text x="780" y="215" font-size="10.5" fill="#5a4a3a" text-anchor="middle">KDTree obstacle cloud</text>
    <text x="780" y="232" font-size="10.5" fill="#5a4a3a" text-anchor="middle">log-odds confidence grid</text>
    <text x="780" y="252" font-size="10" fill="#8a7a6a" text-anchor="middle" font-style="italic">world-frame projection</text>
    <text x="780" y="267" font-size="10" fill="#8a7a6a" text-anchor="middle" font-style="italic">FK + IMU rotation</text>
    <text x="780" y="284" font-size="10" fill="#8a7a6a" text-anchor="middle" font-style="italic">FOV-gap persistence</text>
  </g>
  <g stroke="#3a2a1a" stroke-width="1.3" fill="none" marker-end="url(#ar)">
    <path d="M 580 240 L 680 225"/>
  </g>

  <!-- Commands incoming from top-right -->
  <g filter="url(#sh)">
    <rect x="940" y="90" width="250" height="58" rx="8" fill="#ffffff" stroke="#3b5998" stroke-width="1.5"/>
    <text x="1065" y="112" font-size="13" font-weight="700" fill="#3b5998" text-anchor="middle">motion intent</text>
    <text x="1065" y="130" font-size="10" fill="#5a4a3a" text-anchor="middle">keyboard · auto_sweep · sequence</text>
  </g>

  <!-- MotionGuard chokepoint -->
  <g filter="url(#sh)">
    <rect x="680" y="360" width="510" height="100" rx="10" fill="#fff3e8" stroke="#8a3a1a" stroke-width="2.4"/>
    <text x="935" y="388" font-size="15" font-weight="700" fill="#8a3a1a" text-anchor="middle">MotionGuard chokepoint — SafetyAPI.plan_and_validate</text>
    <text x="935" y="410" font-size="11" fill="#5a4a3a" text-anchor="middle">gates on BOTH voxel memory AND fresh ToF snapshot</text>
    <text x="935" y="428" font-size="11" fill="#5a4a3a" text-anchor="middle">capsule-vs-cloud distance check against every arm link</text>
    <text x="935" y="448" font-size="10" fill="#8a3a1a" text-anchor="middle" font-style="italic">returns ACCEPT / REPLAN / REFUSE</text>
  </g>

  <!-- World model → MotionGuard -->
  <g stroke="#8a3a1a" stroke-width="2" fill="none" marker-end="url(#ar-rust)">
    <path d="M 780 290 L 780 360"/>
  </g>
  <!-- Intent → MotionGuard -->
  <g stroke="#8a3a1a" stroke-width="2" fill="none" marker-end="url(#ar-rust)">
    <path d="M 1065 148 L 1065 360"/>
  </g>

  <!-- Output: arm -->
  <g filter="url(#sh)">
    <rect x="820" y="520" width="230" height="60" rx="8" fill="#ffffff" stroke="#3a2a1a" stroke-width="1.8"/>
    <text x="935" y="545" font-size="13" font-weight="700" fill="#3a2a1a" text-anchor="middle">Arm — Braccio V2</text>
    <text x="935" y="564" font-size="10" fill="#5a4a3a" text-anchor="middle" font-family="'JetBrains Mono',monospace">SET ALL / SET DELTA</text>
  </g>
  <g stroke="#8a3a1a" stroke-width="2.5" fill="none" marker-end="url(#ar-rust)">
    <path d="M 935 460 L 935 520"/>
  </g>

  <!-- Refused dialog (left of MotionGuard) -->
  <g filter="url(#sh)">
    <rect x="470" y="520" width="230" height="60" rx="8" fill="#f6efd9" stroke="#8a7a5a" stroke-width="1.4"/>
    <text x="585" y="545" font-size="12" font-weight="700" fill="#5a4a3a" text-anchor="middle">dialog.py</text>
    <text x="585" y="564" font-size="10" fill="#5a4a3a" text-anchor="middle">refusal message to operator</text>
  </g>
  <g stroke="#8a7a5a" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#ar)">
    <path d="M 710 460 Q 640 480 620 520"/>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 598)" font-size="10.5" fill="#3a2a1a">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#8a3a1a" stroke-width="2.3"/>
    <text x="36" y="4">safety-critical path (gated command)</text>
    <line x1="260" y1="0" x2="288" y2="0" stroke="#3a2a1a" stroke-width="1.3"/>
    <text x="296" y="4">sensor → processing</text>
    <line x1="460" y1="0" x2="488" y2="0" stroke="#8a7a5a" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="496" y="4">refused-intent feedback</text>
  </g>
</svg>
